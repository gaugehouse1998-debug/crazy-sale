<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Crazy Sale - Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      // If we are hosted at https://username.github.io/repo/
      var redirectPath = '/' + (repoName ? repoName + '/' : '') + '#/' + 
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash;
      
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + redirectPath);
    </script>
  </head>
  <body>
    <p>Redirecting to Crazy Sale...</p>
  </body>
</html>
